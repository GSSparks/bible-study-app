services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      PORT: 8088
      DATABASE_URL: postgresql://bible:${POSTGRES_PASSWORD:-bible}@db:5432/bible_study
      SWORD_MODULES_PATH: /data/sword-modules
      MD_MODULES_PATH: /data/md-modules
      PDF_STORAGE_PATH: /data/pdfs
      UPLOADS_PATH: /data/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      MERRIAM_WEBSTER_API_KEY: ${MERRIAM_WEBSTER_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BIBLE_MAPS_PATH: /data/bible-maps
      BIBLE_MAPS_CACHE_PATH: /data/bible-maps-cache
    volumes:
      - sword_modules:/data/sword-modules
      - md_modules:/data/md-modules
      - pdf_storage:/data/pdfs
      - ./uploads:/data/uploads
      - ./bible-images:/data/bible-maps
      - bible_maps_cache:/data/bible-maps-cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bible
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bible}
      POSTGRES_DB: bible_study
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible -d bible_study"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sword_modules:
  md_modules:
  pdf_storage:
  pg_data:
  bible_maps_cache:
