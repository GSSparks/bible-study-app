name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scriptorium_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # node-sword-interface requires the SWORD C++ library (libsword) to compile
      # its native Node.js addon.  That library is not in Ubuntu's apt repos and
      # is not needed at test time — the entire module is aliased to a JS mock in
      # vitest.config.js.  Skip all postinstall/gyp scripts, then rebuild only
      # argon2 (the one other native module we actually call at test time), and
      # generate the Prisma client that prisma's own postinstall would have done.
      - name: Install backend dependencies (skip native builds)
        working-directory: backend
        run: npm install --ignore-scripts

      - name: Build argon2 native module
        working-directory: backend
        run: npm rebuild argon2

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/scriptorium_test

      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/scriptorium_test

      - name: Run backend tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/scriptorium_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
          SWORD_MODULES_PATH: /tmp/sword-modules
          PDF_STORAGE_PATH: /tmp/pdfs
          BIBLE_MAPS_PATH: /tmp/maps

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --ignore-scripts

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
